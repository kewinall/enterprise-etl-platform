# Compact pointer to the executable enterprise reference at repository root.
# The root .gitlab-ci.yml is intentionally kept alongside GitHub Actions.
#
# Validation:
#   python ci/gitlab/verify_reference.py
#
# Enterprise invariants:
#   - build candidate once
#   - run unit/security/SBOM/vulnerability gates
#   - promote candidate to TEST by registry digest
#   - require approval for PROD
#   - promote the same digest to PROD; never rebuild
#
include:
  - local: "/.gitlab-ci.yml"
