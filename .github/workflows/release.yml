name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify matching Security workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          security_run_id=""
          for _ in $(seq 1 30); do
            security_run_id="$(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow Security                 --commit "$SHA"                 --event push                 --json databaseId,createdAt                 --jq 'sort_by(.createdAt) | reverse | .[0].databaseId'
            )"

            if [[ -n "$security_run_id" && "$security_run_id" != "null" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$security_run_id" || "$security_run_id" == "null" ]]; then
            echo "No matching Security workflow run found for $SHA."
            exit 1
          fi

          gh run watch "$security_run_id"             --repo "$GITHUB_REPOSITORY"             --exit-status

      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          notes_file="docs/releases/$tag.md"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi

          if [[ ! -f "$notes_file" ]]; then
            echo "Missing bilingual release notes: $notes_file"
            exit 1
          fi

          gh release create "$tag"             --repo "$GITHUB_REPOSITORY"             --target "$SHA"             --title "$tag — Enterprise Data Engineering Platform"             --notes-file "$notes_file"
