name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository policy
        run: python scripts/validate_repository.py
      - name: Compile Python
        run: python -m compileall -q airflow scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Docker Compose
        run: docker compose config --quiet
