name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository policy
        run: python scripts/validate_repository.py

      - name: Compile Python
        run: python -m compileall -q airflow etl_intelligence scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Execute ETL Intelligence smoke test
        run: bash scripts/etl_intelligence_smoke.sh

      - name: Execute P1 modernization / lineage integration smoke test
        run: bash scripts/p1_integration_smoke.sh

      - name: Validate GitLab enterprise delivery reference
        run: python ci/gitlab/verify_reference.py

      - name: Execute vulnerability remediation lifecycle smoke test
        run: bash scripts/vulnerability_lifecycle_smoke.sh

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Execute PostgreSQL audit/retry/persistence lifecycle smoke test
        run: bash scripts/etl_lifecycle_smoke.sh

      - name: Execute Prometheus/Grafana/SLO/alert observability smoke test
        run: bash scripts/observability_smoke.sh

      - name: Execute immutable image promotion/offline bundle smoke test
        run: bash scripts/supply_chain_smoke.sh

      - name: Upload offline release bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: dist/release/*
          if-no-files-found: error
