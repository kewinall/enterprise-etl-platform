services:
  postgres:
    image: postgres:16-alpine
    hostname: etl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etl_audit}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_user} -d ${POSTGRES_DB:-etl_audit}"]
      interval: 5s
      timeout: 5s
      retries: 12

  hop:
    image: ${HOP_IMAGE:-enterprise-etl-hop:local}
    build:
      context: .
      dockerfile: docker/hop-runtime.Dockerfile
      args:
        VERSION: ${PLATFORM_VERSION:-0.5.0}
        VCS_REF: ${VCS_REF:-local}
    hostname: etl-hop
    profiles: ["etl", "orchestration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOP_PROJECT_FOLDER: /opt/enterprise-etl/project
      HOP_PROJECT_NAME: enterprise-etl
      HOP_ENVIRONMENT_NAME: compose
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/environment/compose.json
      HOP_SERVER_HOSTNAME: 0.0.0.0
      HOP_SERVER_PORT: ${HOP_SERVER_PORT:-8181}
      HOP_SERVER_USER: ${HOP_SERVER_USER:-hop-user}
      HOP_SERVER_PASS: ${HOP_SERVER_PASS:-synthetic-hop-password}
      HOP_LOG_LEVEL: Basic
    ports:
      - "8181:8181"
    volumes:
      - ./hop/environments/compose.json:/files/environment/compose.json:ro

  airflow:
    image: ${AIRFLOW_IMAGE:-apache/airflow:3.0.6}
    hostname: etl-airflow
    profiles: ["orchestration"]
    command: standalone
    depends_on:
      hop:
        condition: service_started
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PLATFORM_ENV: ${PLATFORM_ENV:-DEV}
      HOP_BASE_URL: http://hop:8181
      HOP_SERVER_USER: ${HOP_SERVER_USER:-hop-user}
      HOP_SERVER_PASS: ${HOP_SERVER_PASS:-synthetic-hop-password}
      HOP_PIPELINE_PATH: "$${PROJECT_HOME}/pipelines/synthetic_customer_daily.hpl"
      HOP_AUDIT_START_PATH: "$${PROJECT_HOME}/pipelines/audit_execution_start.hpl"
      HOP_AUDIT_FINALIZE_PATH: "$${PROJECT_HOME}/pipelines/audit_execution_finalize.hpl"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro

  sql-exporter:
    image: ${SQL_EXPORTER_IMAGE:-burningalchemist/sql_exporter:0.24.8}
    hostname: etl-sql-exporter
    profiles: ["monitoring"]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -config.file=/config/sql_exporter.yml
    ports:
      - "9399:9399"
    volumes:
      - ./monitoring/sql-exporter:/config:ro

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.0}
    hostname: etl-alertmanager
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    hostname: etl-prometheus
    profiles: ["monitoring"]
    depends_on:
      - sql-exporter
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.1}
    hostname: etl-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-synthetic-grafana-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
